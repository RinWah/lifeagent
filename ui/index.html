<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeAgent Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #f0f0f0; padding: 24px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #1a1a1a; border-radius: 12px; padding: 20px; border: 1px solid #2a2a2a; }
    .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #888; margin-bottom: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .event { padding: 8px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.9rem; }
    .event:last-child { border-bottom: none; }
    .event-time { color: #888; font-size: 0.75rem; margin-top: 2px; }
    .routine { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.9rem; }
    .routine:last-child { border-bottom: none; }
    .badge { padding: 2px 8px; border-radius: 99px; font-size: 0.7rem; background: #22c55e22; color: #22c55e; }
    .badge.pending { background: #f59e0b22; color: #f59e0b; }
    .approval { background: #1a1a2e; border: 1px solid #3b3b6b; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .approval p { font-size: 0.85rem; margin-bottom: 8px; }
    .btn-row { display: flex; gap: 8px; }
    .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-approve { background: #22c55e; color: #000; }
    .btn-snooze { background: #2a2a2a; color: #f0f0f0; }
    .laundry-btn { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #3b82f6; color: #fff; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .laundry-timer { font-size: 2rem; font-weight: 700; text-align: center; padding: 12px 0; color: #3b82f6; }
    .empty { color: #555; font-size: 0.85rem; padding: 8px 0; }
  </style>
</head>
<body>
  <h1>🤖 LifeAgent</h1>
  <p class="subtitle"><span class="status-dot"></span>Agent running · <span id="clock"></span></p>

  <div class="grid">
    <div class="card">
      <h2>Today's Schedule</h2>
      <div id="events">
        <p class="empty">Loading events...</p>
      </div>
    </div>

    <div class="card">
      <h2>Pending Approvals</h2>
      <div id="approvals">
        <p class="empty">No pending approvals</p>
      </div>
    </div>

    <div class="card">
      <h2>Routines</h2>
      <div class="routine"><span>💊 Meds</span><span class="badge">8:00 AM</span></div>
      <div class="routine"><span>🌙 Sleep</span><span class="badge">11:00 PM</span></div>
      <div class="routine"><span>🧺 Laundry</span><span class="badge pending" id="laundry-status">Ready</span></div>
    </div>

    <div class="card">
      <h2>Laundry Timer</h2>
      <div class="laundry-timer" id="laundry-display">45:00</div>
      <button class="laundry-btn" id="laundry-btn" onclick="startLaundry()">Start Laundry Timer</button>
    </div>
  </div>

  <script>
    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Mock events (replace with API call later)
    const events = [
      { time: "3:45 PM", title: "Test Class" },
      { time: "9:00 AM", title: "STAT 305" },
    ];

    const eventsEl = document.getElementById('events');
    if (events.length === 0) {
      eventsEl.innerHTML = '<p class="empty">No events today</p>';
    } else {
      eventsEl.innerHTML = events.map(e => `
        <div class="event">
          <div>${e.title}</div>
          <div class="event-time">${e.time}</div>
        </div>`).join('');
    }

    // Laundry timer
    let laundryInterval = null;
    let secondsLeft = 45 * 60;

    function startLaundry() {
      if (laundryInterval) return;
      document.getElementById('laundry-status').textContent = 'Running';
      document.getElementById('laundry-btn').textContent = 'Running...';
      document.getElementById('laundry-btn').disabled = true;
      laundryInterval = setInterval(() => {
        secondsLeft--;
        const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
        const s = (secondsLeft % 60).toString().padStart(2, '0');
        document.getElementById('laundry-display').textContent = m + ':' + s;
        if (secondsLeft <= 0) {
          clearInterval(laundryInterval);
          document.getElementById('laundry-status').textContent = 'Done!';
          document.getElementById('laundry-display').textContent = '00:00';
          alert('Laundry is done!');
        }
      }, 1000);
    }
  </script>
</body>
</html>
